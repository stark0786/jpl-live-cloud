<!doctype html><html><head><meta charset="utf-8"><title>JPL LIVE Cloud OBS Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;color:#fff;font-family:Arial}#stage{width:1920px;height:1080px;position:relative}.top{position:absolute;top:38px;left:55px;right:55px;height:150px;background:linear-gradient(100deg,#071b36,#17436e,#071b36);border:3px solid #e8ba35;border-radius:22px;display:flex;align-items:center;padding:25px;box-shadow:0 8px 25px #0008}.brand{width:280px}.brand b{font-size:45px;color:#ffcf3f}.brand small{display:block;letter-spacing:5px}.team{flex:1;text-align:center}.team b{font-size:34px}.team small{display:block;color:#bdd1e8}.score{width:390px;text-align:center;border-left:2px solid #ffffff55;border-right:2px solid #ffffff55}.score b{font-size:68px;color:#ffcf3f}.score small{display:block;font-size:22px}.match{position:absolute;top:205px;left:70px;font-size:20px;text-shadow:0 2px 5px #000}.lower{position:absolute;bottom:48px;left:55px;right:55px;display:flex;gap:16px}.panel{background:#071b36ed;border:2px solid #e8ba35;border-radius:15px;padding:18px 24px;box-shadow:0 5px 20px #0008}.bat{flex:1}.bowl{width:440px}.panel h3{margin:0 0 10px;color:#ffcf3f;letter-spacing:2px}.row{display:flex;justify-content:space-between;font-size:25px;padding:5px 0}.last{font-size:22px;color:#ffcf3f}.note{position:absolute;bottom:255px;left:50%;transform:translateX(-50%);background:#e8ba35;color:#071b36;padding:18px 55px;border-radius:12px;font-size:40px;font-weight:bold;opacity:0;transition:opacity .3s}.show{opacity:1}</style></head><body><div id="stage"><div class="top"><div class="brand"><b>JPL LIVE</b><small>SEASON 8</small></div><div class="team"><b id="a">TEAM A</b><small>BATTING</small></div><div class="score"><b id="score">0/0</b><small><span id="overs">0.0</span> OVERS</small></div><div class="team"><b id="b">TEAM B</b><small>BOWLING</small></div></div><div class="match" id="match">JPL SEASON 8 • MATCH LIVE</div><div class="note" id="note"></div><div class="lower"><div class="panel bat"><h3>BATSMEN AT THE CREASE</h3><div class="row"><span id="sn">BATSMAN 1 *</span><span id="ss">0 (0)</span></div><div class="row"><span id="nn">BATSMAN 2</span><span id="ns">0 (0)</span></div><div class="last">LAST BALLS: <span id="last">—</span></div></div><div class="panel bowl"><h3>BOWLER / TARGET</h3><div class="row"><span id="bn">BOWLER</span><span id="bs">0-0</span></div><div class="row"><span>TARGET</span><span id="target">—</span></div></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>const socket=io();const p=new URLSearchParams(location.search);const room=p.get("room")||"JPL8LIVE";socket.on("connect",()=>socket.emit("join",room));let old="";socket.on("state",s=>{const set=(id,x)=>document.getElementById(id).textContent=x;set("a",s.teamA);set("b",s.teamB);set("score",s.score+"/"+s.wickets);set("overs",s.overs+"."+(s.balls%6));set("match",s.tournament+" • "+s.match);set("sn",(s.striker?.name||"BATSMAN 1")+" *");set("nn",s.nonStriker?.name||"BATSMAN 2");set("ss",(s.striker?.runs||0)+" ("+(s.striker?.balls||0)+")");set("ns",(s.nonStriker?.runs||0)+" ("+(s.nonStriker?.balls||0)+")");set("bn",s.bowler?.name||"BOWLER");set("bs",(s.bowler?.wickets||0)+"-"+(s.bowler?.runs||0));set("target",s.target||"—");set("last",(s.lastSix||[]).join("  ")||"—");if(s.note&&s.note!==old){old=s.note;const n=document.getElementById("note");n.textContent=s.note;n.classList.add("show");setTimeout(()=>n.classList.remove("show"),3500)}})</script></body></html>
