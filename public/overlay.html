<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/socket.io/socket.io.js"></script><title>JPL LIVE 4K Overlay</title>
<style>
:root{--font-score:clamp(42px,3.2vw,112px);--font-team:clamp(28px,2.15vw,76px);--font-player:clamp(30px,2.25vw,82px);--font-meta:clamp(22px,1.55vw,58px);--bar:#071d48;--card:#071a34;--accent:#e7b84b;--txt:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:var(--txt);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#bar{position:absolute;left:2%;bottom:3%;width:96%;height:clamp(150px,11.5vh,270px);display:grid;grid-template-columns:1.18fr 1.55fr .72fr 1.02fr 1.45fr;align-items:stretch;border:3px solid var(--accent);border-radius:22px;overflow:hidden;background:linear-gradient(100deg,#071d48 0%,#075e9c 42%,#a71935 66%,#420c20 100%);box-shadow:0 10px 34px #000b;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .5s}
#bar.off{transform:translateY(180%);opacity:0}.cell{padding:1.0% 1.1%;display:flex;align-items:center;justify-content:center;gap:1.0%;border-right:2px solid #ffffff35;min-width:0;overflow:hidden}.team{background:linear-gradient(130deg,#04132ff2,#07518bf2);justify-content:flex-start}.teamInner{display:flex;align-items:center;justify-content:center;gap:4%;width:100%;min-width:0}.logo{width:clamp(68px,6.0vw,180px);height:clamp(68px,8.2vh,180px);object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 4px 10px #0009)}#batLogo{width:clamp(88px,7.0vw,210px);height:clamp(88px,9.2vh,210px)}
.teamText{min-width:0;flex:1;text-align:center}.name{font-size:var(--font-team);font-weight:1000;text-transform:uppercase;line-height:1.04;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%;text-shadow:0 3px 8px #0008}.score{font-size:var(--font-score);font-weight:1000;color:#ffe08a;line-height:1.08;white-space:nowrap;text-shadow:0 3px 10px #0008}.sub{font-size:var(--font-meta);color:#e8f2ff;font-weight:800;line-height:1.12;white-space:nowrap}.batters{background:linear-gradient(135deg,#07549a,#06366e);display:flex;flex-direction:column;align-items:stretch;justify-content:center;text-align:left;padding-left:2.0%;padding-right:2.0%;gap:8%;}.playerLine{display:flex;align-items:baseline;gap:2%;min-width:0;white-space:nowrap;line-height:1.1}.player{font-size:var(--font-player);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0;flex:1;text-shadow:0 3px 8px #0008}.playerStats{font-size:calc(var(--font-meta)*1.05);font-weight:900;color:#d7ecff;white-space:nowrap;flex:0 0 auto}.target{background:linear-gradient(145deg,#8e182d,#d52d47);flex-direction:column;text-align:center;gap:8px}.target strong{font-size:clamp(24px,2vw,72px);font-weight:1000;line-height:1.05}.target span{font-size:var(--font-meta);font-weight:800}.versus{background:linear-gradient(135deg,#34101c,#6d142b);flex-direction:column;gap:5px}.versus b{font-size:clamp(24px,1.8vw,64px);color:#ffd66e;font-weight:1000}.versus .logo{width:clamp(48px,4.2vw,125px);height:clamp(48px,5.4vh,125px)}.bowler{background:linear-gradient(135deg,#9d1832,#4a0b1d);flex-direction:column;align-items:stretch;justify-content:center;text-align:left;padding-left:2%;gap:7%}.bowler .playerLine{justify-content:flex-start}.bowler .player{font-size:var(--font-player)}.bowler .sub{font-size:var(--font-meta);white-space:nowrap}
.tournament{position:absolute;top:0;left:2.5%;display:flex;align-items:center;gap:12px;font-size:clamp(18px,1.3vw,44px);font-weight:1000;color:#fff;text-shadow:0 3px 8px #000;background:#a71935;padding:9px 22px;border-radius:0 0 15px 15px;letter-spacing:1px;z-index:2}.tournament img{width:clamp(40px,3.8vw,110px);height:clamp(40px,4.5vh,110px);object-fit:contain;display:none}
#popup{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%) scale(.5);font-size:clamp(70px,10vw,300px);font-weight:1000;color:#fff;text-shadow:0 7px 0 #8a1727,0 14px 35px #000;opacity:0;pointer-events:none;white-space:nowrap;z-index:15}#popup.show{animation:pop 3s ease forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}28%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
#card{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,3200px);max-height:82%;overflow:auto;background:linear-gradient(145deg,#071a34f8,#102d52f8);border:5px solid var(--accent);border-radius:30px;padding:2.0% 2.4%;box-shadow:0 18px 75px #000e;z-index:8;color:var(--txt)}#card.visible{display:block;animation:cardIn .45s ease both}#card h2{text-align:center;margin:0 0 1.0%;color:#ffd56a;font-size:clamp(36px,3.2vw,108px);letter-spacing:2px;font-weight:1000}#card .teamHeading{text-align:center;font-size:clamp(25px,2.3vw,78px);font-weight:900;color:#fff;margin:0 0 1.2%}#card table{width:100%;border-collapse:collapse;font-size:clamp(24px,2vw,68px)}#card td,#card th{padding:1.0% 1.2%;border-bottom:2px solid #ffffff35;text-align:right;font-weight:800}#card th{background:#a51e39;color:#fff;font-size:clamp(21px,1.65vw,58px)}#card td:first-child,#card th:first-child{text-align:left}#card p{font-size:clamp(19px,1.5vw,52px);line-height:1.25;margin:.7% 0}.tag{color:#ffd56a}
#intro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2%;background:radial-gradient(circle,#173d69f5,#020817fa);z-index:10;text-align:center}#intro.show{display:flex;animation:introIn .45s ease both}#intro img{max-width:45vw;max-height:52vh;object-fit:contain;filter:drop-shadow(0 0 35px #ffd56a);animation:logoPulse 1.6s ease-in-out infinite alternate}#intro strong{font-size:clamp(48px,7vw,220px);color:#ffe08a;text-shadow:0 5px 24px #000}@keyframes cardIn{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes introIn{from{opacity:0}to{opacity:1}}@keyframes logoPulse{from{transform:scale(.94)}to{transform:scale(1.05)}}
#customLayer{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2.2%;background:linear-gradient(135deg,#06152ef5,#143d6bf5);z-index:20;text-align:center;padding:4%}#customLayer.visible{display:flex}#customLayer.anim-zoom{animation:customZoom .45s ease both}#customLayer.anim-slide{animation:customSlide .5s ease both}#customLayer.anim-fade{animation:customFade .6s ease both}@keyframes customZoom{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@keyframes customSlide{from{opacity:0;transform:translateY(12%)}to{opacity:1;transform:translateY(0)}}@keyframes customFade{from{opacity:0}to{opacity:1}}#customLayer h1{font-size:clamp(52px,7vw,220px);margin:0;color:#fff;text-shadow:0 5px 24px #000;font-weight:1000}#customLayer img{max-width:42vw;max-height:50vh;object-fit:contain;filter:drop-shadow(0 8px 24px #000)}#nextTeams{display:flex;align-items:center;justify-content:center;gap:5vw;width:100%}#nextTeams .nextSide{display:flex;align-items:center;flex-direction:column;gap:16px;font-size:clamp(32px,4.2vw,130px);font-weight:1000;text-shadow:0 4px 15px #000;max-width:38%;overflow:hidden}#nextTeams img{width:min(22vw,480px);height:min(24vh,480px);object-fit:contain}#nextTeams b{font-size:clamp(55px,8vw,240px);color:#ffd56a}#nextDetails{font-size:clamp(28px,3vw,96px);color:#ffd56a;font-weight:1000}
@media(max-width:1100px){#bar{height:150px;grid-template-columns:1.12fr 1.4fr .7fr .95fr 1.25fr;border-radius:10px}.cell{padding:5px;gap:4px}.logo{width:48px;height:55px}#batLogo{width:58px;height:65px}.name{font-size:clamp(13px,2vw,22px)}.player{font-size:clamp(13px,1.8vw,20px)}.playerStats,.sub{font-size:clamp(10px,1.2vw,14px)}.score{font-size:clamp(20px,2.5vw,30px)}#card{width:94%;max-height:84%;padding:14px}}
</style></head><body>
<div id="intro"><img id="introLogo" alt="Tournament logo"><strong id="introName">JPL</strong></div>
<div class="tournament" id="tour"><img id="tourLogo" alt="Tournament logo"><span id="tourName">JPL</span></div>
<div id="bar">
 <div class="cell team"><div class="teamInner"><img id="batLogo" class="logo" alt="Batting team logo"><div class="teamText"><div class="name fit" id="batTeam">TEAM A</div><div class="score" id="score">0/0</div><div class="sub" id="overs">0.0 / 20 OV</div></div></div></div>
 <div class="cell batters"><div class="playerLine"><span class="player fit" id="p1">Striker</span><span class="playerStats" id="p1Stats">0 (0)</span></div><div class="playerLine"><span class="player fit" id="p2">Non-striker</span><span class="playerStats" id="p2Stats">0 (0)</span></div></div>
 <div class="cell target"><strong id="target">1ST INNINGS</strong><span id="targetSub">LIVE SCORE</span></div>
 <div class="cell versus"><b>VS</b><img id="bowlLogo" class="logo" alt="Bowling team logo"><div class="name fit" id="bowlTeam">TEAM B</div></div>
 <div class="cell bowler"><div class="playerLine"><span class="player fit" id="bowler">Bowler</span></div><div class="sub" id="bowlFigures">0.0 - 0 - 0 • ECO 0.00</div></div>
</div>
<div id="popup"></div><div id="customLayer"><div id="nextDetails"></div><div id="nextTeams"><div class="nextSide"><img id="nextLogoA" alt="Next team A"><span class="fit" id="nextNameA"></span></div><b>VS</b><div class="nextSide"><img id="nextLogoB" alt="Next team B"><span class="fit" id="nextNameB"></span></div></div><h1 id="customHeading"></h1><img id="customPic" alt="Custom popup image"></div>
<div id="card"><h2 id="cardTitle">BATTING SCORECARD</h2><div class="teamHeading" id="cardTeam"></div><div id="cardBody"></div></div>
<script>
const room=new URLSearchParams(location.search).get("room")||"JPL8LIVE",socket=io();let lastAnn="",timer=null,lastAction=0,modeTimer=null,lastCustomKey="",customTimer=null,firstState=true;
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setImg(id,src){const el=document.getElementById(id);el.src=src||"";el.style.visibility=src?"visible":"hidden"}
function fitText(el,maxPx,minPx){if(!el)return;el.style.fontSize=maxPx+"px";let size=maxPx;const parent=el.parentElement;while(size>minPx && (el.scrollWidth>parent.clientWidth-8 || el.scrollHeight>parent.clientHeight-4)){size-=1;el.style.fontSize=size+"px"}}
function autoFit(){document.querySelectorAll(".fit").forEach(el=>{const cs=getComputedStyle(el);fitText(el,parseFloat(cs.fontSize)||70,14)})}
function renderScore(s){const battingA=s.battingTeam!=="B",bat=battingA?s.teamA:s.teamB,bowl=battingA?s.teamB:s.teamA,batLogo=battingA?s.logoA:s.logoB,bowlLogo=battingA?s.logoB:s.logoA;
 document.getElementById("tourName").textContent=s.tournament||"LIVE";const tl=document.getElementById("tourLogo");tl.src=s.tournamentLogo||"";tl.style.display=s.tournamentLogo?"block":"none";
 if(s.overlayAction&&s.overlayAction!==lastAction){lastAction=s.overlayAction;playBroadcast(s.overlayMode,s)}else if(firstState&&s.tournamentLogo){firstState=false;playBroadcast("show",s)}
 document.getElementById("batTeam").textContent=bat||"BAT";document.getElementById("bowlTeam").textContent=bowl||"BOWL";setImg("batLogo",batLogo);setImg("bowlLogo",bowlLogo);
 document.getElementById("score").textContent=`${s.score}/${s.wickets}`;document.getElementById("overs").textContent=`${Math.floor(s.balls/6)}.${s.balls%6} / ${s.totalOvers} OV`;
 const bs=s.battingStats||[],p1=bs.find(x=>x.name===s.striker),p2=bs.find(x=>x.name===s.nonStriker);document.getElementById("p1").textContent=s.striker||"Striker";document.getElementById("p1Stats").textContent=`${p1?p1.runs:0} (${p1?p1.balls:0})`;document.getElementById("p2").textContent=s.nonStriker||"Non-striker";document.getElementById("p2Stats").textContent=`${p2?p2.runs:0} (${p2?p2.balls:0})`;
 document.getElementById("target").textContent=s.target?`TARGET ${s.target}`:"1ST INNINGS";document.getElementById("targetSub").textContent=s.target?`Need ${Math.max(0,s.target-s.score)} runs`:"LIVE SCORE";
 const bw=(s.bowlingStats||[]).find(x=>x.name===s.bowler);document.getElementById("bowler").textContent=s.bowler||"Bowler";const o=bw?`${Math.floor(bw.balls/6)}.${bw.balls%6}`:"0.0",eco=bw&&bw.balls?(bw.runs/(bw.balls/6)).toFixed(2):"0.00";document.getElementById("bowlFigures").textContent=`${o} OV  •  ${bw?bw.runs:0} RUNS  •  ${bw?bw.wickets:0} WKTS  •  ECO ${eco}`;
 if(s.announcement&&s.announcement!==lastAnn){lastAnn=s.announcement;showPopup(s.announcement)}else if(!s.announcement)lastAnn="";
 const card=document.getElementById("card");if(s.scorecardVisible){card.classList.add("visible");renderCard(s)}else card.classList.remove("visible");requestAnimationFrame(autoFit)}
function playBroadcast(mode,s){const bar=document.getElementById("bar"),intro=document.getElementById("intro");clearTimeout(modeTimer);document.getElementById("introName").textContent=s.tournament||"LIVE";const logo=document.getElementById("introLogo");logo.src=s.tournamentLogo||"";logo.style.display=s.tournamentLogo?"block":"none";if(mode==="hide"){bar.classList.add("off");intro.classList.add("show");modeTimer=setTimeout(()=>intro.classList.remove("show"),2400)}else{intro.classList.add("show");bar.classList.add("off");modeTimer=setTimeout(()=>{intro.classList.remove("show");bar.classList.remove("off")},1900)}}
function showPopup(t){const p=document.getElementById("popup");p.textContent=t;p.className="show";clearTimeout(timer);timer=setTimeout(()=>p.className="",3000)}
function renderCard(s){const mode=s.scorecardMode==="bowling"?"bowling":"batting",battingA=s.battingTeam!=="B",bat=battingA?s.teamA:s.teamB,bowl=battingA?s.teamB:s.teamA;document.getElementById("cardTitle").textContent=mode==="batting"?"BATTING SCORECARD":"BOWLING SCORECARD";document.getElementById("cardTeam").textContent=mode==="batting"?`BATTING TEAM: ${bat}`:`BOWLING TEAM: ${bowl}`;
 const rows=mode==="batting"?(s.battingStats||[]).map(p=>`<tr><td>${safe(p.name)}<br><small class="tag">${safe(p.dismissal||"not out")}</small></td><td>${p.runs}</td><td>${p.balls}</td><td>${p.fours}</td><td>${p.sixes}</td><td>${p.balls?(p.runs*100/p.balls).toFixed(1):"0.0"}</td></tr>`).join(""):(s.bowlingStats||[]).map(p=>`<tr><td>${safe(p.name)}</td><td>${Math.floor(p.balls/6)}.${p.balls%6}</td><td>${p.maidens}</td><td>${p.runs}</td><td>${p.wickets}</td><td>${p.balls?(p.runs/(p.balls/6)).toFixed(2):"0.00"}</td></tr>`).join("");
 const head=mode==="batting"?"<tr><th>Batter / Dismissal</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>":"<tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>ECO</th></tr>";
 const ex=s.extras||{wd:0,nb:0,b:0,lb:0};const extra=mode==="batting"?`<p>Extras: ${ex.wd+ex.nb+ex.b+ex.lb} (Wd ${ex.wd}, Nb ${ex.nb}, B ${ex.b}, Lb ${ex.lb}) • Total ${s.score}/${s.wickets}</p><p>Fall of wickets: ${(s.fallOfWickets||[]).map(x=>`${x.score}-${x.wicket} (${safe(x.batter)}, ${x.over})`).join(" • ")}</p>`:"";
 document.getElementById("cardBody").innerHTML=`<table>${head}${rows}</table>${extra}<p class="tag">Overs: ${(s.oversLog||[]).map(o=>o.over+": "+o.balls.join(",")).join(" | ")} ${(s.currentOver||[]).length?" | "+((s.oversLog||[]).length+1)+": "+s.currentOver.join(","):""}</p>`}
function applyDisplay(s){const d=s.displaySettings||{},root=document.documentElement;const vars={fontScore:"--font-score",fontTeam:"--font-team",fontPlayer:"--font-player",fontMeta:"--font-meta"};for(const [k,v] of Object.entries(vars))if(d[k])root.style.setProperty(v,d[k]+"px");if(d.colourBar)document.getElementById("bar").style.background=d.colourBar;if(d.colourAccent){root.style.setProperty("--accent",d.colourAccent);document.getElementById("card").style.borderColor=d.colourAccent}if(d.colourCard)document.getElementById("card").style.background=d.colourCard;if(d.colourText)root.style.setProperty("--txt",d.colourText);requestAnimationFrame(autoFit)}
function renderCustom(s){const p=s.customPopup||{},layer=document.getElementById("customLayer"),key=JSON.stringify(p);if(key===lastCustomKey)return;lastCustomKey=key;clearTimeout(customTimer);layer.className="";if(!p.visible)return;const next=p.kind==="next";document.getElementById("nextDetails").textContent=next?(p.details||"NEXT MATCH"):"";document.getElementById("nextTeams").style.display=next?"flex":"none";document.getElementById("customHeading").textContent=next?"":(p.text||"");document.getElementById("customPic").src=next?"":(p.image||"");document.getElementById("customPic").style.display=!next&&p.image?"block":"none";document.getElementById("nextNameA").textContent=p.teamA||"TEAM A";document.getElementById("nextNameB").textContent=p.teamB||"TEAM B";setImg("nextLogoA",p.logoA);setImg("nextLogoB",p.logoB);layer.classList.add("visible","anim-"+(p.animation||"zoom"));requestAnimationFrame(autoFit);customTimer=setTimeout(()=>{layer.classList.remove("visible")},Math.max(2,Math.min(120,+p.duration||10))*1000)}
function render(s){renderScore(s);applyDisplay(s);renderCustom(s)}socket.on("connect",()=>socket.emit("join",room));socket.on("state",render);window.addEventListener("resize",()=>requestAnimationFrame(autoFit));
</script></body></html>
