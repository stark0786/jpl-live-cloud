<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPL LIVE Pro Broadcast Overlay</title>
<style>
:root{--gold:#f7c948;--cyan:#36d6ff;--navy:#061329;--blue:#102f61;--white:#f7fbff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--white)}
#stage{position:relative;width:1920px;height:1080px;transform-origin:top left}
.lower-third{position:absolute;left:42px;right:42px;bottom:34px;display:grid;grid-template-columns:440px 1fr 410px;gap:13px;align-items:stretch}
.panel{position:relative;min-height:116px;padding:13px 18px 12px;background:linear-gradient(115deg,rgba(4,13,31,.97) 0%,rgba(9,35,76,.97) 55%,rgba(13,54,103,.96) 100%);border:1px solid rgba(91,185,255,.65);border-top:3px solid var(--gold);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.12);overflow:hidden}
.panel:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(180deg,var(--gold),#e78d22)}
.panel:after{content:"";position:absolute;right:-38px;top:-42px;width:130px;height:130px;border:1px solid rgba(54,214,255,.15);transform:rotate(35deg)}
.label{position:relative;z-index:1;font-size:14px;letter-spacing:2.2px;font-weight:900;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.scoreline{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.teams{font-size:19px;font-weight:900;line-height:1.3;text-transform:uppercase;text-shadow:0 2px 5px #000}
.total{font-size:43px;line-height:1;font-weight:1000;white-space:nowrap;letter-spacing:-1px;text-shadow:0 2px 8px #0008}
.overs{font-size:16px;color:var(--cyan);font-weight:900;white-space:nowrap;margin-top:5px;text-align:right;letter-spacing:1px}
.middle{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-left:21px;padding-right:21px}
.batter{position:relative;z-index:1;min-width:0;padding-left:11px;border-left:2px solid rgba(54,214,255,.5)}
.player{font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.figures{font-size:26px;font-weight:1000;margin-top:7px;color:#fff}
.figures small{font-size:14px;color:#a9c9e9;font-weight:700}
.bowler-name{font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.bowler-fig{font-size:27px;font-weight:1000;white-space:nowrap;color:var(--white)}
.bowler-sub{font-size:14px;color:#9dc7ec;margin-top:6px;font-weight:700;letter-spacing:.5px}
#flash{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.7);min-width:570px;text-align:center;padding:28px 58px;border:3px solid #fff;border-radius:15px;background:linear-gradient(120deg,rgba(3,13,32,.98),rgba(12,48,99,.98));color:#fff;font-size:112px;line-height:1;font-weight:1000;letter-spacing:5px;text-shadow:0 3px 0 rgba(0,0,0,.3),0 0 22px currentColor;box-shadow:0 16px 55px rgba(0,0,0,.6),inset 0 0 35px rgba(255,255,255,.07);opacity:0;visibility:hidden}
#flash:before{content:"JPL • SEASON 8";display:block;font-size:16px;letter-spacing:5px;margin-bottom:12px;color:#fff;opacity:.8}
#flash.show{visibility:visible;animation:pop 3s ease both}
#flash.six{border-color:var(--gold);color:var(--gold);background:linear-gradient(120deg,rgba(33,22,2,.98),rgba(102,57,4,.98))}
#flash.four{border-color:var(--cyan);color:var(--cyan);background:linear-gradient(120deg,rgba(2,19,42,.98),rgba(4,69,104,.98))}
#flash.wicket{border-color:#ff5364;color:#ff6574;background:linear-gradient(120deg,rgba(38,3,16,.98),rgba(107,10,28,.98))}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%,82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
</style></head>
<body><div id="stage">
<div class="lower-third">
<section class="panel"><div class="label" id="match">JPL SEASON 8 • MATCH LIVE</div><div class="scoreline"><div class="teams"><span id="teamA">TEAM A</span><br><span id="teamB" style="color:#9dc7ec">vs TEAM B</span></div><div style="text-align:right"><div class="total"><span id="score">0</span>/<span id="wickets">0</span></div><div class="overs"><span id="overs">0.0</span> OVERS</div></div></div></section>
<section class="panel middle"><div class="batter"><div class="label">STRIKER *</div><div class="player" id="striker">BATSMAN 1</div><div class="figures"><span id="sruns">0</span> <small>(<span id="sballs">0</span>)</small></div></div><div class="batter"><div class="label">NON-STRIKER</div><div class="player" id="nonStriker">BATSMAN 2</div><div class="figures"><span id="nruns">0</span> <small>(<span id="nballs">0</span>)</small></div></div></section>
<section class="panel"><div class="label">BOWLER</div><div class="scoreline"><div class="bowler-name" id="bowler">BOWLER</div><div class="bowler-fig"><span id="bwickets">0</span>/<span id="bruns">0</span></div></div><div class="bowler-sub"><span id="bovers">0.0</span> OVERS&nbsp;&nbsp; • &nbsp;&nbsp;ECON <span id="economy">0.00</span></div></section>
</div><div id="flash"></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),room=new URLSearchParams(location.search).get("room")||"JPL8LIVE",el=id=>document.getElementById(id),put=(id,v)=>el(id).textContent=v;
let lastAnnouncementId=null,flashTimer=null;socket.on("connect",()=>socket.emit("join",room));
function showAnnouncement(a){if(!a||a.id===lastAnnouncementId)return;lastAnnouncementId=a.id;const b=el("flash");b.textContent=a.text||a.type||"";b.className="";b.classList.add(a.type==="SIX"?"six":a.type==="FOUR"?"four":"wicket");void b.offsetWidth;b.classList.add("show");if(flashTimer)clearTimeout(flashTimer);flashTimer=setTimeout(()=>b.classList.remove("show"),3000)}
socket.on("state",s=>{put("match",(s.tournament||"JPL SEASON 8")+" • "+(s.match||"MATCH LIVE"));put("teamA",s.teamA||"TEAM A");put("teamB","vs "+(s.teamB||"TEAM B"));put("score",s.score??0);put("wickets",s.wickets??0);put("overs",(s.overs??0)+"."+((s.balls??0)%6));const st=s.striker||{},ns=s.nonStriker||{},bw=s.bowler||{};put("striker",st.name||"BATSMAN 1");put("sruns",st.runs??0);put("sballs",st.balls??0);put("nonStriker",ns.name||"BATSMAN 2");put("nruns",ns.runs??0);put("nballs",ns.balls??0);put("bowler",bw.name||"BOWLER");put("bwickets",bw.wickets??0);put("bruns",bw.runs??0);const balls=bw.balls??0;put("bovers",Math.floor(balls/6)+"."+balls%6);put("economy",balls?((bw.runs??0)/(balls/6)).toFixed(2):"0.00");showAnnouncement(s.announcement)});
</script></body></html>
