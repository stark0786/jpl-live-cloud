<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPL LIVE Controller</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#091426;color:#fff;font:15px Arial,sans-serif;padding:14px}.wrap{max-width:1050px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h1{margin:0;color:#ffd56a}.status{font-size:12px;color:#8fffc1}.card{background:#14243c;border:1px solid #294666;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 6px 20px #0004}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:block;color:#a9c4e5;font-size:12px;margin-bottom:5px}input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #385779;background:#08172a;color:#fff}button{border:0;border-radius:9px;padding:12px 14px;font-weight:700;background:#2265a8;color:#fff;margin:3px;cursor:pointer}button.gold{background:#d49a22;color:#111}button.red{background:#c82e43}button.green{background:#16845c}.buttons{display:flex;flex-wrap:wrap;gap:5px}.run button{min-width:54px;font-size:18px}.small{font-size:12px;color:#9bb6d5}.file{padding:8px}.section-title{color:#ffd56a;margin:0 0 10px}.score{font-size:25px;font-weight:800;color:#ffd56a}.pill{display:inline-block;padding:5px 9px;background:#243e5d;border-radius:20px;margin:3px;font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}button{padding:11px}}
</style></head><body><div class="wrap"><div class="head"><h1>🏏 LIVE MATCH CONTROLLER</h1><span class="status" id="status">Connecting…</span></div>
<div class="card"><h3 class="section-title">Tournament & Match Setup</h3><div class="grid">
<div><label>Tournament Name</label><input id="tournament" value="JPL"></div><div><label>Match</label><input id="match" value="Match 01"></div>
<div><label>Team A</label><input id="teamA" value="Team A"></div><div><label>Team B</label><input id="teamB" value="Team B"></div>
<div><label>Team A Logo (phone gallery)</label><input class="file" id="logoAFile" type="file" accept="image/*"></div><div><label>Team B Logo (phone gallery)</label><input class="file" id="logoBFile" type="file" accept="image/*"></div>
<div><label>Tournament Logo (optional)</label><input class="file" id="tLogoFile" type="file" accept="image/*"></div><div><label>Total Overs</label><select id="totalOvers"><option>5</option><option>10</option><option>15</option><option selected>20</option><option>25</option><option>custom</option></select></div>
<div><label>Batting Team</label><select id="battingTeam"><option value="A">Team A</option><option value="B">Team B</option></select></div><div><label>Target (0 if first innings)</label><input id="target" type="number" min="0" value="0"></div></div>
<button class="gold" onclick="saveSetup()">SAVE MATCH SETUP</button></div>
<div class="card"><h3 class="section-title">Player Squads (saved on this phone/browser)</h3><div class="grid"><div><label>Team A Players (one name per line)</label><textarea id="squadA" rows="5"></textarea></div><div><label>Team B Players (one name per line)</label><textarea id="squadB" rows="5"></textarea></div></div><button onclick="saveSquads()">SAVE SQUADS</button></div>
<div class="card"><h3 class="section-title">Live Players</h3><div class="grid"><div><label>Striker</label><select id="striker"></select></div><div><label>Non-striker</label><select id="nonStriker"></select></div><div><label>Bowler</label><select id="bowler"></select></div><div><label>Incoming batter (for wicket)</label><select id="incoming"></select></div></div><button onclick="savePlayers()">UPDATE PLAYERS</button><button onclick="swapBatters()">SWAP BATTERS</button></div>
<div class="card"><h3 class="section-title">Scoring</h3><div class="score" id="liveScore">0/0 (0.0)</div><div class="buttons run"><button onclick="run(0)">0</button><button onclick="run(1)">1</button><button onclick="run(2)">2</button><button onclick="run(3)">3</button><button class="green" onclick="run(4)">4</button><button class="gold" onclick="run(6)">6</button></div>
<p class="small">Extras (choose total additional runs)</p><div class="grid"><div><label>Wide + runs</label><input id="wideRuns" type="number" value="0" min="0"><button onclick="extra('wide')">ADD WIDE</button></div><div><label>No-ball + bat runs</label><input id="nbRuns" type="number" value="0" min="0"><button onclick="extra('noball')">ADD NO BALL</button></div><div><label>Byes</label><input id="byeRuns" type="number" value="1" min="0"><button onclick="extra('bye')">ADD BYE</button></div><div><label>Leg Byes</label><input id="lbRuns" type="number" value="1" min="0"><button onclick="extra('legbye')">ADD LEG BYE</button></div></div>
<div class="grid"><div><label>Dismissal type</label><select id="dismissalType"><option value="bowled">Bowled</option><option value="caught">Caught</option><option value="lbw">LBW</option><option value="runout">Run Out</option><option value="stumped">Stumped</option><option value="hit wicket">Hit Wicket</option><option value="retired hurt">Retired Hurt</option></select></div><div><label>Fielder / catcher name (optional)</label><input id="fielder" placeholder="Fielder name"></div><div><label>Who is out?</label><select id="outBatter"><option value="striker">Striker</option><option value="nonStriker">Non-striker</option></select></div></div><button class="red" onclick="wicket()">WICKET / RUN OUT</button><button onclick="undo()">UNDO LAST BALL</button></div>
<div class="card"><h3 class="section-title">Broadcast Controls</h3><button class="gold" onclick="scorecard('batting')">SHOW BATTING SCORECARD</button><button class="gold" onclick="scorecard('bowling')">SHOW BOWLING SCORECARD</button><button onclick="hideCard()">HIDE SCORECARD</button><button onclick="announce('FOUR','four')">FOUR</button><button onclick="announce('SIX','six')">SIX</button><button class="red" onclick="announce('WICKET','wicket')">WICKET</button><button class="red" onclick="announce('RUN OUT','runout')">RUN OUT</button><button onclick="announce('','')">CLEAR POPUP</button><button onclick="resetMatch()">RESET INNINGS</button><p class="small">OBS Overlay: /overlay.html?room=JPL8LIVE</p></div></div>
<script>
const room=new URLSearchParams(location.search).get("room")||"JPL8LIVE", socket=io();let state=null,logos={logoA:"",logoB:"",tournamentLogo:""};
const $=id=>document.getElementById(id);
function setStatus(t){$("status").textContent=t}
socket.on("connect",()=>{setStatus("Connected • "+room);socket.emit("join",room)});socket.on("disconnect",()=>setStatus("Disconnected"));
socket.on("state",s=>{state=s;$("liveScore").textContent=`${s.score}/${s.wickets} (${Math.floor(s.balls/6)}.${s.balls%6})`;if(s.squads){$("squadA").value=(s.squads.A||[]).join("\\n");$("squadB").value=(s.squads.B||[]).join("\\n")}});
function fileData(file){return new Promise(resolve=>{if(!file)return resolve("");let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}
async function saveSetup(){logos.logoA=await fileData($("logoAFile").files[0])||logos.logoA;logos.logoB=await fileData($("logoBFile").files[0])||logos.logoB;logos.tournamentLogo=await fileData($("tLogoFile").files[0])||logos.tournamentLogo;let overs=$("totalOvers").value;if(overs==="custom")overs=Number(prompt("Enter total overs",20)||20);socket.emit("update",{tournament:$("tournament").value,match:$("match").value,teamA:$("teamA").value,teamB:$("teamB").value,logoA:logos.logoA,logoB:logos.logoB,tournamentLogo:logos.tournamentLogo,totalOvers:Number(overs),battingTeam:$("battingTeam").value,target:Number($("target").value)});setStatus("Match setup saved")}
function saveSquads(){let A=$("squadA").value.split(/\\n/).map(x=>x.trim()).filter(Boolean),B=$("squadB").value.split(/\\n/).map(x=>x.trim()).filter(Boolean);localStorage.setItem("jpl_squads",JSON.stringify({A,B}));socket.emit("update",{squads:{A,B}});fillPlayers()}
function fillPlayers(){let a=JSON.parse(localStorage.getItem("jpl_squads")||'{"A":[],"B":[]}'),names=[...a.A,...a.B];["striker","nonStriker","incoming"].forEach(id=>{let old=$(id).value;$(id).innerHTML='<option value="">Select player</option>'+names.map(n=>`<option>${esc(n)}</option>`).join("");$(id).value=old});let old=$("bowler").value;$("bowler").innerHTML='<option value="">Select bowler</option>'+names.map(n=>`<option>${esc(n)}</option>`).join("");$("bowler").value=old}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function savePlayers(){socket.emit("update",{striker:$("striker").value,nonStriker:$("nonStriker").value,bowler:$("bowler").value})}
function run(n){socket.emit("ball",{type:"run",runs:n})}
function extra(t){let id={wide:"wideRuns",noball:"nbRuns",bye:"byeRuns",legbye:"lbRuns"}[t];socket.emit("ball",{type:t,runs:Number($(id).value)})}
function wicket(){let d=$("dismissalType").value,out=$("outBatter").value==="striker"?$("striker").value:$("nonStriker").value;socket.emit("ball",{type:d==="runout"?"runout":"wicket",dismissalType:d,dismissal:d+(d==="caught"&&$("fielder").value?" "+$("fielder").value:"") ,fielder:$("fielder").value,outBatter:out,incoming:$("incoming").value})}
function undo(){socket.emit("undo")}
function swapBatters(){socket.emit("swap")}
function scorecard(m){socket.emit("showScorecard",m)}
function hideCard(){socket.emit("hideScorecard")}
function announce(text,type){socket.emit("announce",{text,type})}
function resetMatch(){if(confirm("Reset current innings score?"))socket.emit("reset")}
fillPlayers();let saved=JSON.parse(localStorage.getItem("jpl_squads")||'{"A":[],"B":[]}');$("squadA").value=saved.A.join("\\n");$("squadB").value=saved.B.join("\\n");
</script></body></html>
